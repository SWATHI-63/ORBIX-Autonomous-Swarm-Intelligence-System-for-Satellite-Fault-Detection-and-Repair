<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIX - Autonomous Satellite Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              space: { 900: "#050b14", 800: "#0b1220", 700: "#131b2f" },
              orbix: { accent: "#00f2fe", alert: "#ff3d71" }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Orbitron', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body { 
        background: #050b14; 
        color: white; 
        margin: 0; 
        padding: 0;
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, h5, h6, .font-extrabold {
        font-family: 'Orbitron', sans-serif;
      }
      /* Custom animated scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050b14;
      }
      ::-webkit-scrollbar-thumb {
        background: #131b2f;
        border-radius: 4px;
        border: 1px solid rgba(0,242,254,0.1);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f2fe;
        box-shadow: 0 0 10px rgba(0,242,254,0.5);
      }
    </style>
  </head>
  <body class="bg-space-900 text-white min-h-screen selection:bg-orbix-accent selection:text-space-900 overflow-x-hidden antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
